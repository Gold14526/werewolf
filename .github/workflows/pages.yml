name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Validate Neon function bundle
        run: npm run build:neon
      - name: Build static site
        run: npm run build
      - name: Set multiplayer API address
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const apiBase = (process.env.API_BASE_URL || '').trim().replace(/\/+$/, '');
          if (apiBase && new URL(apiBase).protocol !== 'https:') {
            throw new Error('API_BASE_URL must be an HTTPS URL');
          }
          writeFileSync('dist/config.js', `window.MOONWOLF_CONFIG = ${JSON.stringify({ apiBase })};\n`);
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
