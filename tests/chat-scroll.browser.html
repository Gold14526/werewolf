<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../web/">
  <title>Chat scroll regression</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="problem-math.css">
  <link rel="stylesheet" href="problem.css">
</head>
<body>
  <div id="app"></div><div id="modal-root"></div><div id="toast"></div>
  <!-- Serve the repository root over HTTP and open /tests/chat-scroll.browser.html.
       Run at desktop and phone widths. The fixture uses the actual renderer and CSS
       and mocks room polling. A pass/fail report appears after all animation frames. -->
  <output id="report" style="position:fixed;top:0;right:0;padding:8px;background:white;z-index:100">Running…</output>
  <script type="module">
    import {STANDARD_CONFIG} from './engine.js';
    const report = document.getElementById('report');
    const player = {id:'chat-test',name:'发言测试',seat:1,ready:true};
    const room = {code:'132467',name:'浏览器滚动回归',hostId:player.id,visibility:'private',
      players:[player],messages:[],game:null,config:STANDARD_CONFIG};
    function appendMessage() {
      const id = room.messages.length + 1;
      room.messages.push({id:String(id),name:player.name,seat:1,at:id,channel:'public',text:'发言 ' + id});
    }
    for (let i = 0; i < 60; i++) appendMessage();
    window.fetch = async input => {
      const path = new URL(input,location.href).pathname;
      const replies = {'/api/health':{ok:true,service:'moonwolf'},'/api/session':{token:'fixture-session',player},
        '/api/room':{room},'/api/rooms':{rooms:[]},'/api/history':{history:[]},'/api/stats':{standings:[]}};
      if (!replies[path]) throw new Error('Unexpected API call ' + path);
      return Response.json(replies[path]);
    };
    const frame = () => new Promise(requestAnimationFrame);
    function check(value,message) { if (!value) throw new Error(message); }
    async function waitFor(predicate) {
      const end = performance.now() + 8000;
      while (!predicate()) { if (performance.now() > end) throw new Error('Timed out waiting for UI'); await frame(); }
    }
    try {
      await import('./app.js');
      await waitFor(() => document.querySelector('[data-do="copy-room"]'));
      document.querySelector('[data-sidebar-toggle="discussion"]').click();
      const feed = document.querySelector('#feed-public'), draft = document.querySelector('#draft-public');
      check(getComputedStyle(feed).scrollBehavior === 'auto','Feed uses animated scrolling');
      await document.fonts.ready;
      const originalRow = feed.firstElementChild;
      const form = draft.form;
      const tracked = [feed,form,draft,originalRow];
      let detached = false;
      const observer = new MutationObserver(changes => {
        for (const change of changes) for (const node of change.removedNodes) {
          if (tracked.some(trackedNode => node.contains(trackedNode))) detached = true;
        }
      });
      observer.observe(document.getElementById('app'),{subtree:true,childList:true});
      for (const editing of [false,true]) for (const pinned of [false,true]) {
        if (editing) {
          draft.focus({preventScroll:true});
          draft.value = '中文候选输入中';
          draft.dispatchEvent(new Event('input',{bubbles:true}));
          draft.setSelectionRange(1,3);
          draft.dispatchEvent(new CompositionEvent('compositionstart',{bubbles:true,data:'zhong'}));
        } else draft.blur();
        feed.scrollTop = pinned ? feed.scrollHeight : 127;
        window.scrollTo(0,Math.max(90, window.scrollY + feed.getBoundingClientRect().top - 90));
        await frame();
        const y = window.scrollY, start = feed.scrollTop, oldLast = feed.lastElementChild;
        const since = performance.now();
        appendMessage();
        document.dispatchEvent(new Event('visibilitychange'));
        let applied = false;
        do {
          await frame();
          applied = feed.lastElementChild !== oldLast;
          check(!detached && document.querySelector('#feed-public') === feed,'Detached chat subtree');
          check(Math.abs(window.scrollY - y) <= 1,'Page moved on an animation frame');
          const expected = pinned && applied ? feed.scrollHeight - feed.clientHeight : start;
          check(Math.abs(feed.scrollTop - expected) <= 1,'Log moved on an animation frame');
          if (editing) {
            check(document.activeElement === draft && draft.value === '中文候选输入中','Lost native input state');
            check(draft.selectionStart === 1 && draft.selectionEnd === 3,'Lost selection');
          }
          check(performance.now() - since < 8000,'Room poll did not reach the feed');
        } while (!applied || performance.now() - since < 700);
        if (editing) draft.dispatchEvent(new CompositionEvent('compositionend',{bubbles:true,data:'中'}));
      }
      observer.disconnect();
      report.value = 'PASS — chat nodes, viewport, IME selection and scroll stable on every sampled frame';
      document.title = 'PASS — Chat scroll regression';
    } catch (error) {
      report.value = 'FAIL — ' + error.message;
      document.title = 'FAIL — Chat scroll regression';
      console.error(error);
    }
  </script>
</body>
</html>
